spring.application.name=api-gateway-grupo09
server.port=8070

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webmvc.routes[0].id=pedido-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://PEDIDO-SERVICE-GRUPO09
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/pedidos/**

spring.cloud.gateway.server.webmvc.routes[1].id=pago-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://PAGO-SERVICE-GRUPO09
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/pagos/**